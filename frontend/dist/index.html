<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杰仔数据中心</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ========== CSS 变量系统 · 暮光琥珀 (Twilight Amber) ========== */
        :root {
            /* 主色 — 深化去霓虹，保留暖调但更沉稳 */
            --orange: #C44536;        /* 赤陶红：取代亮橙，温润有质感 */
            --magenta: #7B2D8E;       /* 皇室紫：取代荧光洋红，深邃高级 */
            --hot-pink: #A8346C;      /* 深莓色：取代热粉，优雅内敛 */
            --amber: #D49A37;         /* 古铜金：取代亮琥珀，奢华低调 */
            --teal: #3A8E7C;          /* 鼠尾草青：取代荧光绿，沉稳平衡 */
            --coral: #B33A2E;         /* 深珊瑚：取代亮红，浓郁有力 */
            --peach: #E8B4A0;         /* 暮色桃：柔和暖灰调 */
            --sunset-pink: #C56B7E;   /* 玫瑰粉：温柔不刺眼 */

            /* 背景 — 更接近羊皮纸的温润感 */
            --bg-cream: #FAF6F1;
            --bg-white: #FFFFFF;
            --bg-glass: rgba(250, 246, 241, 0.75);
            --bg-glass-strong: rgba(250, 246, 241, 0.92);

            /* 文字 — 深咖色调，高对比但不刺眼 */
            --text-primary: #1F1611;
            --text-secondary: #5C4A3D;
            --text-muted: #9A8B7E;
            --text-on-gradient: #FFFFFF;

            /* 边框 — 极淡暖色渗透 */
            --border-light: rgba(196, 69, 54, 0.08);
            --border-medium: rgba(196, 69, 54, 0.18);
            --border-strong: rgba(123, 45, 142, 0.2);

            /* 渐变 — 深色系渐变，质感优先 */
            --grad-primary: linear-gradient(135deg, #C44536 0%, #7B2D8E 100%);
            --grad-sunset: linear-gradient(135deg, #B33A2E 0%, #6B2470 100%);
            --grad-peach: linear-gradient(135deg, #E8B4A0 0%, #C56B7E 50%, #B8527A 100%);
            --grad-golden: linear-gradient(135deg, #D49A37 0%, #C44536 50%, #7B2D8E 100%);
            --grad-warm-glow: radial-gradient(circle at 30% 30%, rgba(196,69,54,0.08), transparent 70%);

            /* 阴影 — 中性暖灰，不喧宾夺主 */
            --shadow-sm: 0 2px 8px rgba(31, 22, 17, 0.04);
            --shadow-md: 0 4px 20px rgba(31, 22, 17, 0.06);
            --shadow-lg: 0 8px 32px rgba(31, 22, 17, 0.08);
            --shadow-hover: 0 20px 40px rgba(31, 22, 17, 0.1), 0 0 30px rgba(196, 69, 54, 0.06);

            /* 字体 */
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;

            /* 动画曲线 */
            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-entrance: cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background: var(--bg-cream);
            color: var(--text-primary);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        #app { min-height: 100vh; position: relative; }

        /* ========== 背景流动色块 ========== */
        .bg-blobs {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        .blob {
            position: absolute;
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            filter: blur(100px);
            opacity: 0.22;
            animation: morph 20s ease-in-out infinite;
        }
        .blob-1 {
            width: 500px; height: 500px;
            background: var(--orange);
            top: -10%; left: -5%;
            animation-delay: 0s;
        }
        .blob-2 {
            width: 400px; height: 400px;
            background: var(--magenta);
            top: 30%; right: -8%;
            animation-delay: -7s;
            opacity: 0.15;
        }
        .blob-3 {
            width: 350px; height: 350px;
            background: var(--hot-pink);
            bottom: -10%; left: 30%;
            animation-delay: -14s;
            opacity: 0.12;
        }
        @keyframes morph {
            0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: translate(0, 0) rotate(0deg); }
            33% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; transform: translate(30px, -20px) rotate(120deg); }
            66% { border-radius: 50% 50% 40% 60% / 40% 70% 50% 40%; transform: translate(-20px, 30px) rotate(240deg); }
        }

        /* ========== 顶部导航 ========== */
        .header {
            background: var(--bg-glass-strong);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            padding: 0 32px;
            height: 68px;
            display: flex;
            align-items: center;
            box-shadow: 0 1px 0 var(--border-light);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* Logo */
        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-right: 48px;
            text-decoration: none;
        }
        .logo-mark {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            width: 32px;
            height: 32px;
        }
        .logo-mark span {
            border-radius: 3px;
            background: var(--grad-primary);
            opacity: 0.4;
        }
        .logo-mark span:nth-child(1) { opacity: 1; }
        .logo-mark span:nth-child(2) { opacity: 0.7; }
        .logo-mark span:nth-child(3) { opacity: 0.4; }
        .logo-mark span:nth-child(4) { opacity: 0.8; }
        .logo-mark span:nth-child(5) { opacity: 1; }
        .logo-mark span:nth-child(6) { opacity: 0.6; }
        .logo-mark span:nth-child(7) { opacity: 0.5; }
        .logo-mark span:nth-child(8) { opacity: 0.9; }
        .logo-mark span:nth-child(9) { opacity: 0.7; }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(90deg, #C44536, #7B2D8E, #A8346C, #C44536);
            background-size: 300% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientFlow 8s linear infinite;
            letter-spacing: -0.01em;
        }
        @keyframes gradientFlow {
            to { background-position: 300% center; }
        }

        .header-nav {
            display: flex;
            gap: 4px;
            flex: 1;
        }
        .nav-item {
            padding: 8px 20px;
            cursor: pointer;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.3s var(--ease-smooth);
            position: relative;
        }
        .nav-item:hover {
            color: var(--orange);
            background: rgba(196, 69, 54, 0.06);
        }
        .nav-item.active {
            color: var(--text-on-gradient);
            background: var(--grad-primary);
            box-shadow: 0 4px 12px rgba(196, 69, 54, 0.2);
        }

        /* ========== 内容区域 ========== */
        .content-area {
            padding: 28px 32px;
            max-width: 1680px;
            margin: 0 auto;
            animation: fadeIn 0.4s var(--ease-smooth);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== 统计卡片 Bento Grid ========== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-glass);
            backdrop-filter: blur(12px) saturate(160%);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 22px 24px;
            box-shadow: var(--shadow-md);
            transition: all 0.4s var(--ease-spring);
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: cardEntrance 0.6s var(--ease-entrance) forwards;
        }
        .stat-card:nth-child(1) { animation-delay: 0.05s; }
        .stat-card:nth-child(2) { animation-delay: 0.1s; }
        .stat-card:nth-child(3) { animation-delay: 0.15s; }
        .stat-card:nth-child(4) { animation-delay: 0.2s; }
        .stat-card:nth-child(5) { animation-delay: 0.25s; }
        .stat-card:nth-child(6) { animation-delay: 0.3s; }

        .stat-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--grad-primary);
            border-radius: 0 3px 3px 0;
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 120px; height: 120px;
            background: var(--grad-warm-glow);
            pointer-events: none;
        }
        .stat-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: var(--border-medium);
        }
        .stat-card .label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .stat-card .value {
            font-size: 32px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            background: var(--grad-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-card .value.solid { -webkit-text-fill-color: initial; background: none; }
        .stat-card .value.green { color: var(--teal); -webkit-text-fill-color: var(--teal); background: none; }
        .stat-card .value.orange { color: var(--orange); -webkit-text-fill-color: var(--orange); background: none; }
        .stat-card .value.red { color: var(--coral); -webkit-text-fill-color: var(--coral); background: none; }
        .stat-card .value.blue { color: var(--magenta); -webkit-text-fill-color: var(--magenta); background: none; }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(24px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ========== 矩阵看板 ========== */
        .matrix-container {
            background: var(--bg-glass);
            backdrop-filter: blur(12px) saturate(160%);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 28px;
            box-shadow: var(--shadow-md);
            margin-bottom: 24px;
        }

        .matrix-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .matrix-tab {
            padding: 8px 18px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            background: rgba(196, 69, 54, 0.06);
            color: var(--text-secondary);
            border: 1px solid var(--border-light);
            transition: all 0.3s var(--ease-smooth);
        }
        .matrix-tab:hover {
            background: rgba(196, 69, 54, 0.12);
            color: var(--orange);
            border-color: var(--border-medium);
        }
        .matrix-tab.active {
            background: var(--grad-primary);
            color: var(--text-on-gradient);
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(196, 69, 54, 0.18);
        }

        .matrix-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 6px;
        }
        .matrix-table th {
            padding: 12px 16px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            background: rgba(196, 69, 54, 0.04);
            border-radius: 10px;
        }
        .matrix-table td {
            padding: 14px 16px;
            text-align: center;
            font-size: 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.5);
            transition: all 0.3s var(--ease-smooth);
        }
        .matrix-table td.cell {
            cursor: pointer;
            position: relative;
        }
        .matrix-table td.cell:hover {
            transform: scale(1.05);
            background: rgba(196, 69, 54, 0.08);
            box-shadow: 0 0 0 2px var(--orange), var(--shadow-md);
            z-index: 1;
        }
        .matrix-table td.cell .count {
            font-size: 20px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            background: var(--grad-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .matrix-table td.cell.empty .count {
            background: none;
            -webkit-text-fill-color: var(--text-muted);
            color: var(--text-muted);
            opacity: 0.4;
        }
        .matrix-table td.cell .previews {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            justify-content: center;
        }
        .matrix-table td.cell .previews img {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid var(--border-light);
        }

        /* ========== 工具栏 ========== */
        .toolbar {
            background: var(--bg-glass);
            backdrop-filter: blur(12px) saturate(160%);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }
        .toolbar input, .toolbar select {
            padding: 8px 14px;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            font-size: 14px;
            font-family: var(--font-sans);
            color: var(--text-primary);
            background: var(--bg-white);
            outline: none;
            transition: all 0.3s var(--ease-smooth);
        }
        .toolbar input:focus, .toolbar select:focus {
            border-color: var(--orange);
            box-shadow: 0 0 0 3px rgba(196, 69, 54, 0.12);
        }
        .toolbar input { min-width: 220px; }
        .toolbar input::placeholder { color: var(--text-muted); }

        .btn {
            padding: 8px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid var(--border-light);
            background: var(--bg-white);
            color: var(--text-secondary);
            transition: all 0.3s var(--ease-smooth);
            font-family: var(--font-sans);
        }
        .btn:hover {
            border-color: var(--border-medium);
            color: var(--orange);
            background: rgba(196, 69, 54, 0.04);
        }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary {
            background: var(--grad-primary);
            color: var(--text-on-gradient);
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(196, 69, 54, 0.18);
        }
        .btn-primary:hover {
            background: var(--grad-sunset);
            color: var(--text-on-gradient);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(196, 69, 54, 0.22);
        }

        /* ========== 商品卡片 ========== */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 18px;
        }
        .product-card {
            background: var(--bg-white);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: all 0.4s var(--ease-spring);
            position: relative;
            opacity: 0;
            animation: cardEntrance 0.5s var(--ease-entrance) forwards;
        }
        .product-card:nth-child(1) { animation-delay: 0.03s; }
        .product-card:nth-child(2) { animation-delay: 0.06s; }
        .product-card:nth-child(3) { animation-delay: 0.09s; }
        .product-card:nth-child(4) { animation-delay: 0.12s; }
        .product-card:nth-child(5) { animation-delay: 0.15s; }
        .product-card:nth-child(6) { animation-delay: 0.18s; }
        .product-card:nth-child(7) { animation-delay: 0.21s; }
        .product-card:nth-child(8) { animation-delay: 0.24s; }
        .product-card:nth-child(n+9) { animation-delay: 0.27s; }

        .product-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            border-radius: 0 4px 4px 0;
            z-index: 2;
        }
        .product-card[data-stock="充足"]::before { background: var(--teal); }
        .product-card[data-stock="紧张"]::before { background: var(--amber); }
        .product-card[data-stock="缺货"]::before { background: var(--coral); }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
            border-color: var(--border-medium);
        }
        .product-card .card-img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            background: linear-gradient(135deg, #F5EDE7, #EDE3EE);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            overflow: hidden;
        }
        .product-card .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s var(--ease-smooth);
        }
        .product-card:hover .card-img img {
            transform: scale(1.06);
        }
        .product-card .card-body { padding: 14px 18px; }
        .product-card .card-sku {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }
        .product-card .card-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-primary);
            line-height: 1.35;
        }
        .product-card .card-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .product-card .card-price {
            font-size: 18px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            background: var(--grad-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .product-card .card-stock { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
        .product-card .card-tags { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }

        /* 状态标签 */
        .tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 500;
        }
        .tag-green { background: rgba(58, 142, 124, 0.12); color: var(--teal); }
        .tag-orange { background: rgba(212, 154, 55, 0.15); color: #A87822; }
        .tag-red { background: rgba(179, 58, 46, 0.12); color: var(--coral); }
        .tag-magenta { background: rgba(123, 45, 142, 0.12); color: var(--magenta); }
        .tag-amber { background: rgba(196, 69, 54, 0.12); color: var(--orange); }
        .tag-gray { background: rgba(160, 133, 116, 0.15); color: var(--text-muted); }

        /* ========== 表格视图 ========== */
        .product-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: var(--bg-white);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .product-table th {
            background: var(--bg-glass-strong);
            backdrop-filter: blur(8px);
            padding: 14px 16px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-light);
        }
        .product-table td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(196, 69, 54, 0.06);
            font-size: 13px;
            color: var(--text-secondary);
        }
        .product-table tbody tr {
            transition: background 0.2s var(--ease-smooth);
        }
        .product-table tbody tr:hover {
            background: rgba(196, 69, 54, 0.04);
        }
        .product-table tbody tr:last-child td { border-bottom: none; }
        .product-table img {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border-light);
        }
        .product-table .no-img {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: linear-gradient(135deg, #F5EDE7, #EDE3EE);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 20px;
        }
        .product-table .price-cell {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            background: var(--grad-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .product-table .sku-cell {
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: -0.02em;
        }

        /* ========== 分页 ========== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 28px;
        }
        .pagination .page-info {
            font-size: 13px;
            color: var(--text-muted);
            margin-right: 16px;
            font-variant-numeric: tabular-nums;
        }

        /* ========== 抽屉（详情） ========== */
        .drawer-mask {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(31, 22, 17, 0.35);
            backdrop-filter: blur(4px);
            z-index: 200;
            animation: fadeIn 0.3s var(--ease-smooth);
        }
        .drawer {
            position: fixed;
            top: 0; right: 0;
            width: 520px;
            max-width: 92vw;
            height: 100vh;
            background: var(--bg-glass-strong);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            z-index: 201;
            overflow-y: auto;
            padding: 28px;
            box-shadow: -8px 0 40px rgba(196, 69, 54, 0.12);
            animation: slideInRight 0.4s var(--ease-spring);
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        .drawer-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .drawer-close {
            cursor: pointer;
            font-size: 18px;
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s var(--ease-smooth);
        }
        .drawer-close:hover {
            background: rgba(196, 69, 54, 0.1);
            color: var(--orange);
            transform: rotate(90deg);
        }

        .detail-section { margin-bottom: 24px; }
        .detail-section h3 {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 14px;
            padding-left: 12px;
            border-left: 3px solid;
            border-image: var(--grad-primary) 1;
        }
        .detail-row {
            display: flex;
            padding: 7px 0;
            font-size: 14px;
        }
        .detail-row .label {
            width: 120px;
            color: var(--text-muted);
            flex-shrink: 0;
            font-weight: 500;
        }
        .detail-row .value {
            color: var(--text-primary);
            flex: 1;
            font-weight: 500;
        }
        .detail-img {
            width: 100%;
            max-height: 320px;
            object-fit: contain;
            border-radius: 14px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #F5EDE7, #EDE3EE);
            box-shadow: var(--shadow-md);
        }
        .fee-card {
            background: rgba(196, 69, 54, 0.04);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            transition: all 0.3s var(--ease-smooth);
        }
        .fee-card:hover {
            border-color: var(--border-medium);
            box-shadow: var(--shadow-sm);
        }
        .fee-card .fee-title { font-weight: 600; margin-bottom: 4px; color: var(--text-primary); }
        .fee-card .fee-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

        /* ========== 导入页 ========== */
        .import-area {
            background: var(--bg-glass);
            backdrop-filter: blur(12px) saturate(160%);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 36px;
            box-shadow: var(--shadow-md);
        }
        .import-area h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 24px;
            background: var(--grad-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .upload-zone {
            border: 2px dashed var(--border-medium);
            border-radius: 16px;
            padding: 52px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s var(--ease-smooth);
            background: rgba(196, 69, 54, 0.02);
        }
        .upload-zone:hover {
            border-color: var(--orange);
            background: rgba(196, 69, 54, 0.06);
            box-shadow: 0 0 30px rgba(196, 69, 54, 0.1);
            transform: scale(1.01);
        }
        .upload-zone .icon {
            font-size: 52px;
            margin-bottom: 16px;
            background: var(--grad-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .upload-zone .text { font-size: 15px; color: var(--text-secondary); font-weight: 500; }
        .upload-zone .hint { font-size: 13px; color: var(--text-muted); margin-top: 8px; }

        .import-log { margin-top: 28px; }
        .import-log-item {
            padding: 14px 18px;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-white);
            transition: all 0.3s var(--ease-smooth);
        }
        .import-log-item:hover {
            border-color: var(--border-medium);
            box-shadow: var(--shadow-sm);
        }
        .import-log-item .log-info { flex: 1; }
        .import-log-item .log-file { font-weight: 600; font-size: 14px; color: var(--text-primary); }
        .import-log-item .log-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        /* ========== 模态框 ========== */
        .modal-mask {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(31, 22, 17, 0.35);
            backdrop-filter: blur(4px);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s var(--ease-smooth);
        }
        .modal {
            background: var(--bg-glass-strong);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 28px;
            width: 600px;
            max-width: 90vw;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: modalIn 0.4s var(--ease-spring);
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }

        /* ========== 加载 ========== */
        .loading {
            text-align: center;
            padding: 52px;
            color: var(--text-muted);
            font-size: 15px;
        }
        .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid rgba(196, 69, 54, 0.15);
            border-top-color: var(--orange);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 骨架屏 */
        .skeleton {
            background: linear-gradient(90deg, rgba(196,69,54,0.04) 0%, rgba(196,69,54,0.06) 50%, rgba(196,69,54,0.04) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 8px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .header { padding: 0 16px; }
            .content-area { padding: 16px; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .product-grid { grid-template-columns: 1fr; }
            .drawer { width: 100vw; }
        }

        /* ========== 无障碍：减少动画 ========== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
<!-- 背景流动色块 -->
<div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<div id="app">
    <!-- 顶栏 -->
    <div class="header">
        <div class="logo-wrap">
            <div class="logo-mark">
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
            </div>
            <div class="logo-text">杰仔数据中心</div>
        </div>
        <div class="header-nav">
            <div class="nav-item" :class="{active: page==='dashboard'}" @click="goPage('dashboard')">矩阵看板</div>
            <div class="nav-item" :class="{active: page==='products'}" @click="goPage('products')">商品列表</div>
            <div class="nav-item" :class="{active: page==='import'}" @click="goPage('import')">导入管理</div>
        </div>
    </div>

    <div class="content-area">
        <!-- ============ 矩阵看板 ============ -->
        <template v-if="page==='dashboard'">
            <!-- 统计卡片 -->
            <div class="stats-row">
                <div class="stat-card">
                    <div class="label">总 SKU 数</div>
                    <div class="value">{{ stats.total_skus || 0 }}</div>
                </div>
                <div class="stat-card">
                    <div class="label">总库存件数</div>
                    <div class="value green">{{ (stats.total_stock || 0).toLocaleString() }}</div>
                </div>
                <div class="stat-card">
                    <div class="label">缺货 SKU</div>
                    <div class="value red">{{ stats.out_of_stock_count || 0 }}</div>
                </div>
                <div class="stat-card">
                    <div class="label">已下架</div>
                    <div class="value orange">{{ stats.discontinued_count || 0 }}</div>
                </div>
            </div>

            <!-- 品类分布 -->
            <div class="stats-row" v-if="stats.category_distribution">
                <div class="stat-card" v-for="(count, cat) in stats.category_distribution" :key="cat">
                    <div class="label">{{ cat }}</div>
                    <div class="value blue">{{ count }}</div>
                </div>
            </div>

            <!-- 矩阵 -->
            <div class="matrix-container">
                <div class="matrix-tabs">
                    <div class="matrix-tab" :class="{active: matrixMode==='category,price_range'}" @click="switchMatrix('category,price_range')">品类 × 价格</div>
                    <div class="matrix-tab" :class="{active: matrixMode==='category,stock_status'}" @click="switchMatrix('category,stock_status')">品类 × 库存</div>
                    <div class="matrix-tab" :class="{active: matrixMode==='price_range,stock_status'}" @click="switchMatrix('price_range,stock_status')">价格 × 库存</div>
                    <div class="matrix-tab" :class="{active: matrixMode==='category,product_status'}" @click="switchMatrix('category,product_status')">品类 × 状态</div>
                </div>
                <div v-if="matrixLoading" class="loading"><span class="spinner"></span>加载中...</div>
                <table v-else class="matrix-table">
                    <thead>
                        <tr>
                            <th>{{ matrixData.y_labels?.length > 0 ? yAxisLabel : '' }} \ {{ xAxisLabel }}</th>
                            <th v-for="(x, i) in matrixData.x_labels" :key="i">{{ x }}</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="(y, j) in matrixData.y_labels" :key="j">
                            <td style="font-weight:600;color:var(--text-secondary);">{{ y }}</td>
                            <td v-for="(x, i) in matrixData.x_labels" :key="i"
                                class="cell"
                                :class="{empty: !matrixData.matrix[j] || !matrixData.matrix[j][i]}"
                                @click="cellClick(x, y)">
                                <div class="count">{{ matrixData.matrix[j] ? matrixData.matrix[j][i] || 0 : 0 }}</div>
                                <div class="previews" v-if="matrixData.preview_images && matrixData.preview_images[i + '_' + j]">
                                    <img v-for="(img, k) in matrixData.preview_images[i + '_' + j].slice(0, 5)" :key="k" :src="img" @error="handleImgError">
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </template>

        <!-- ============ 商品列表 ============ -->
        <template v-if="page==='products'">
            <div class="toolbar">
                <input v-model="filters.keyword" placeholder="搜索 SKU 或产品名称" @keyup.enter="loadProducts">
                <select v-model="filters.category">
                    <option value="">全部品类</option>
                    <option v-for="c in categories" :key="c.name" :value="c.name">{{ c.name }} ({{ c.count }})</option>
                </select>
                <select v-model="filters.stock_status">
                    <option value="">全部库存状态</option>
                    <option value="充足">充足</option>
                    <option value="紧张">紧张</option>
                    <option value="缺货">缺货</option>
                </select>
                <select v-model="filters.product_status">
                    <option value="">全部产品状态</option>
                    <option value="在售">在售</option>
                    <option value="已下架">已下架</option>
                    <option value="销完库存下架">销完库存下架</option>
                    <option value="包销">包销</option>
                </select>
                <input v-model.number="filters.min_price" type="number" placeholder="最低$" style="min-width:100px;">
                <input v-model.number="filters.max_price" type="number" placeholder="最高$" style="min-width:100px;">
                <button class="btn btn-primary" @click="loadProducts">搜索</button>
                <button class="btn" @click="resetFilters">重置</button>
                <div style="flex:1"></div>
                <div class="matrix-tab" :class="{active: viewMode==='card'}" @click="viewMode='card'">卡片视图</div>
                <div class="matrix-tab" :class="{active: viewMode==='table'}" @click="viewMode='table'">表格视图</div>
            </div>

            <div v-if="productsLoading" class="loading"><span class="spinner"></span>加载中...</div>

            <!-- 卡片视图 -->
            <div v-else-if="viewMode==='card'" class="product-grid">
                <div class="product-card" v-for="p in products" :key="p.id"
                     :data-stock="p.stock_status"
                     @click="showDetail(p.id)">
                    <div class="card-img">
                        <img v-if="p.image_url" :src="p.image_url" @error="handleImgError">
                        <span v-else>📦</span>
                    </div>
                    <div class="card-body">
                        <div class="card-sku">{{ p.sku }}</div>
                        <div class="card-name">{{ p.product_name || '未命名' }}</div>
                        <div class="card-info">
                            <span class="card-price" v-if="p.price_usd">${{ p.price_usd }}</span>
                            <span class="card-price" v-else style="background:none;-webkit-text-fill-color:var(--text-muted);">—</span>
                            <span class="card-stock">库存: {{ p.stock_total }}</span>
                        </div>
                        <div class="card-tags">
                            <span class="tag" :class="stockTagClass(p.stock_status)">{{ p.stock_status }}</span>
                            <span class="tag tag-magenta" v-if="p.category">{{ p.category }}</span>
                            <span class="tag tag-gray" v-if="p.product_status && p.product_status !== '在售'">{{ p.product_status }}</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 表格视图 -->
            <table v-else class="product-table">
                <thead>
                    <tr>
                        <th>图片</th>
                        <th>SKU</th>
                        <th>产品名称</th>
                        <th>品类</th>
                        <th>USD</th>
                        <th>RMB</th>
                        <th>库存</th>
                        <th>库存状态</th>
                        <th>产品状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="p in products" :key="p.id">
                        <td>
                            <img v-if="p.image_url" :src="p.image_url" @error="handleImgError">
                            <div v-else class="no-img">📦</div>
                        </td>
                        <td class="sku-cell">{{ p.sku }}</td>
                        <td>{{ p.product_name || '—' }}</td>
                        <td>{{ p.category || '—' }}</td>
                        <td class="price-cell">${{ p.price_usd || '—' }}</td>
                        <td style="font-variant-numeric:tabular-nums;">¥{{ p.price_rmb || '—' }}</td>
                        <td style="font-variant-numeric:tabular-nums;">{{ p.stock_total }}</td>
                        <td><span class="tag" :class="stockTagClass(p.stock_status)">{{ p.stock_status }}</span></td>
                        <td><span class="tag" :class="statusTagClass(p.product_status)">{{ p.product_status }}</span></td>
                        <td><button class="btn" style="padding:4px 12px;font-size:12px;" @click="showDetail(p.id)">详情</button></td>
                    </tr>
                </tbody>
            </table>

            <!-- 分页 -->
            <div class="pagination" v-if="total > 0">
                <span class="page-info">共 {{ total }} 条，第 {{ currentPage }}/{{ Math.ceil(total / pageSize) }} 页</span>
                <button class="btn" :disabled="currentPage<=1" @click="changePage(1)">首页</button>
                <button class="btn" :disabled="currentPage<=1" @click="changePage(currentPage-1)">上一页</button>
                <select v-model.number="pageSize" @change="loadProducts" style="padding:6px 10px;border:1px solid var(--border-light);border-radius:8px;font-size:13px;">
                    <option :value="20">20条/页</option>
                    <option :value="50">50条/页</option>
                    <option :value="100">100条/页</option>
                </select>
                <button class="btn" :disabled="currentPage>=Math.ceil(total/pageSize)" @click="changePage(currentPage+1)">下一页</button>
                <button class="btn" :disabled="currentPage>=Math.ceil(total/pageSize)" @click="changePage(Math.ceil(total/pageSize))">末页</button>
            </div>
        </template>

        <!-- ============ 导入管理 ============ -->
        <template v-if="page==='import'">
            <div class="import-area">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <h2>导入 Excel 文件</h2>
                    <button class="btn" style="color:#B33A2E;border-color:rgba(179,58,46,0.3);" @click="clearAllData" :disabled="clearing">
                        {{ clearing ? '清空中...' : '清空所有数据' }}
                    </button>
                </div>
                <div class="upload-zone" @click="$refs.fileInput.click()">
                    <div class="icon">📁</div>
                    <div class="text">{{ importFile ? importFile.name : '点击选择 Excel 文件' }}</div>
                    <div class="hint">上传后自动与现有数据比对，可勾选要应用的变更</div>
                </div>
                <input ref="fileInput" type="file" accept=".xlsx,.xls" style="display:none;" @change="onFileSelect">

                <!-- 比对中 -->
                <div v-if="comparing" style="margin-top:24px;text-align:center;padding:40px;">
                    <span class="spinner"></span> 正在解析并比对数据...
                </div>

                <!-- 比对结果 -->
                <div v-if="compareResult" style="margin-top:24px;">
                    <!-- 文件信息 -->
                    <div style="background:rgba(196,69,54,0.04);border:1px solid var(--border-light);border-radius:12px;padding:16px;margin-bottom:20px;">
                        <div style="font-size:14px;color:var(--text-primary);">
                            文件: <b>{{ compareResult.file_name }}</b> |
                            类型: <b>{{ compareResult.file_type === 'stock' ? '库存表' : '报价表' }}</b> |
                            日期: <b>{{ compareResult.file_date }}</b>
                        </div>
                    </div>

                    <!-- 统计栏 -->
                    <div style="display:flex;gap:16px;margin-bottom:20px;">
                        <div style="flex:1;padding:16px;border-radius:12px;background:rgba(58,142,124,0.08);border:1px solid rgba(58,142,124,0.2);text-align:center;">
                            <div style="font-size:28px;font-weight:800;color:#3A8E7C;">{{ compareResult.summary.new_count }}</div>
                            <div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">新增 SKU</div>
                        </div>
                        <div style="flex:1;padding:16px;border-radius:12px;background:rgba(196,69,54,0.08);border:1px solid rgba(196,69,54,0.2);text-align:center;">
                            <div style="font-size:28px;font-weight:800;color:#C44536;">{{ compareResult.summary.changed_count }}</div>
                            <div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">有变更</div>
                        </div>
                        <div style="flex:1;padding:16px;border-radius:12px;background:rgba(154,139,126,0.08);border:1px solid rgba(154,139,126,0.2);text-align:center;">
                            <div style="font-size:28px;font-weight:800;color:#9A8B7E;">{{ compareResult.summary.unchanged_count }}</div>
                            <div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">无变化</div>
                        </div>
                    </div>

                    <!-- 操作按钮 -->
                    <div style="display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap;">
                        <button class="btn" @click="selectAll">全选</button>
                        <button class="btn" @click="deselectAll">取消全选</button>
                        <button class="btn" @click="selectNewOnly">仅选新增</button>
                        <button class="btn" @click="selectChangedOnly">仅选变更</button>
                        <span style="margin-left:auto;font-size:14px;color:var(--text-secondary);">
                            已选 <b style="color:var(--orange);">{{ selectedSkus.size }}</b> 个 SKU
                        </span>
                    </div>

                    <!-- 变更明细表 -->
                    <div v-if="compareResult.changed_items.length > 0" style="margin-bottom:24px;">
                        <h3 style="margin-bottom:12px;font-size:16px;font-weight:600;">变更明细 ({{ compareResult.changed_items.length }})</h3>
                        <div style="max-height:400px;overflow-y:auto;border:1px solid var(--border-light);border-radius:12px;">
                            <table class="product-table">
                                <thead style="position:sticky;top:0;background:var(--bg-white);z-index:1;">
                                    <tr>
                                        <th style="width:40px;"><input type="checkbox" :checked="allChangedSelected" @change="toggleAllChanged"></th>
                                        <th>SKU</th>
                                        <th>产品名称</th>
                                        <th>变更字段</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="item in compareResult.changed_items" :key="item.sku" :style="{background: selectedSkus.has(item.sku) ? 'rgba(196,69,54,0.04)' : 'transparent'}">
                                        <td><input type="checkbox" :checked="selectedSkus.has(item.sku)" @change="toggleSku(item.sku)"></td>
                                        <td style="font-family:var(--font-mono);font-size:13px;">{{ item.sku }}</td>
                                        <td>{{ item.product_name || '—' }}</td>
                                        <td>
                                            <div v-for="(change, field) in item.changes" :key="field" style="font-size:12px;margin-bottom:4px;">
                                                <span style="color:var(--text-secondary);">{{ change.label }}:</span>
                                                <span style="color:#B33A2E;text-decoration:line-through;">{{ change.old ?? '—' }}</span>
                                                <span style="margin:0 4px;color:var(--text-muted);">→</span>
                                                <span style="color:#3A8E7C;font-weight:600;">{{ change.new ?? '—' }}</span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- 新增 SKU 列表 -->
                    <div v-if="compareResult.new_items.length > 0" style="margin-bottom:24px;">
                        <h3 style="margin-bottom:12px;font-size:16px;font-weight:600;">新增 SKU ({{ compareResult.new_items.length }})</h3>
                        <div style="max-height:300px;overflow-y:auto;border:1px solid var(--border-light);border-radius:12px;">
                            <table class="product-table">
                                <thead style="position:sticky;top:0;background:var(--bg-white);z-index:1;">
                                    <tr>
                                        <th style="width:40px;"><input type="checkbox" :checked="allNewSelected" @change="toggleAllNew"></th>
                                        <th>SKU</th>
                                        <th>产品名称</th>
                                        <th>品类</th>
                                        <th>价格/库存</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="item in compareResult.new_items" :key="item.sku" :style="{background: selectedSkus.has(item.sku) ? 'rgba(58,142,124,0.04)' : 'transparent'}">
                                        <td><input type="checkbox" :checked="selectedSkus.has(item.sku)" @change="toggleSku(item.sku)"></td>
                                        <td style="font-family:var(--font-mono);font-size:13px;">{{ item.sku }}</td>
                                        <td>{{ item.product_name || '—' }}</td>
                                        <td>{{ item.category || '—' }}</td>
                                        <td>{{ item.price_usd != null ? '$' + item.price_usd : (item.stock_total != null ? item.stock_total + '件' : '—') }}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- 确认导入按钮 -->
                    <button class="btn btn-primary" style="margin-top:8px;" @click="confirmImport" :disabled="importing || selectedSkus.size === 0">
                        {{ importing ? '导入中...' : `确认导入 (${selectedSkus.size} 个 SKU)` }}
                    </button>
                </div>

                <!-- 导入结果 -->
                <div v-if="importResult" style="margin-top:24px;padding:16px;border-radius:12px;border:1px solid;" :style="{
                    background: importResult.code === 0 ? 'rgba(58,142,124,0.06)' : 'rgba(179,58,46,0.06)',
                    borderColor: importResult.code === 0 ? 'rgba(58,142,124,0.2)' : 'rgba(179,58,46,0.2)'
                }">
                    <h3 style="font-size:16px;font-weight:600;">{{ importResult.message }}</h3>
                    <div v-if="importResult.data" style="margin-top:8px;font-size:14px;color:var(--text-secondary);">
                        总数: {{ importResult.data.total_rows }} /
                        成功: {{ importResult.data.success_rows }} /
                        合并更新: {{ importResult.data.merged_rows }} /
                        失败: {{ importResult.data.fail_rows }}
                    </div>
                </div>

                <!-- 导入历史 -->
                <div class="import-log" v-if="importLogs.length > 0">
                    <h3 style="margin-bottom:12px;font-size:16px;font-weight:600;">导入历史</h3>
                    <div class="import-log-item" v-for="log in importLogs" :key="log.id">
                        <div class="log-info">
                            <div class="log-file">{{ log.file_name }}</div>
                            <div class="log-meta">
                                类型: {{ log.file_type }} | 日期: {{ log.file_date }} |
                                成功: {{ log.success_rows }} | 合并: {{ log.merged_rows }} |
                                {{ log.imported_at }} | 状态: {{ log.status }}
                            </div>
                        </div>
                        <button v-if="log.status === 'completed'" class="btn" @click="rollback(log.batch_no)">回滚</button>
                    </div>
                </div>
            </div>
        </template>

        <!-- ============ 商品详情抽屉 ============ -->
        <template v-if="detailVisible">
            <div class="drawer-mask" @click="detailVisible=false"></div>
            <div class="drawer">
                <div class="drawer-title">
                    商品详情
                    <span class="drawer-close" @click="detailVisible=false">✕</span>
                </div>
                <div v-if="detailLoading" class="loading"><span class="spinner"></span>加载中...</div>
                <template v-else-if="detail">
                    <img v-if="detail.image_url" :src="detail.image_url" class="detail-img" @error="handleImgError">

                    <div class="detail-section">
                        <h3>基础信息</h3>
                        <div class="detail-row"><span class="label">SKU</span><span class="value" style="font-family:var(--font-mono);">{{ detail.sku }}</span></div>
                        <div class="detail-row"><span class="label">产品名称</span><span class="value">{{ detail.product_name || '—' }}</span></div>
                        <div class="detail-row"><span class="label">英文品类</span><span class="value">{{ detail.product_name_en || '—' }}</span></div>
                        <div class="detail-row"><span class="label">品类</span><span class="value">{{ detail.category || '—' }}</span></div>
                        <div class="detail-row"><span class="label">产品状态</span><span class="value">
                            <span class="tag" :class="statusTagClass(detail.product_status)">{{ detail.product_status }}</span>
                        </span></div>
                        <div class="detail-row" v-if="detail.shipping_mark"><span class="label">唛头</span><span class="value">{{ detail.shipping_mark }}</span></div>
                    </div>

                    <div class="detail-section">
                        <h3>价格信息</h3>
                        <div class="detail-row"><span class="label">USD 价格</span><span class="value" style="font-size:18px;font-weight:700;background:var(--grad-primary);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">${{ detail.price_usd || '—' }}</span></div>
                        <div class="detail-row"><span class="label">RMB 价格</span><span class="value" style="font-variant-numeric:tabular-nums;">¥{{ detail.price_rmb || '—' }}</span></div>
                        <div class="detail-row"><span class="label">价格区间</span><span class="value">{{ detail.price_range || '—' }}</span></div>
                        <div class="detail-row" v-if="detail.limit_price"><span class="label">限价</span><span class="value">{{ detail.limit_price }}</span></div>
                        <div class="detail-row" v-if="detail.first_leg_fee"><span class="label">头程费</span><span class="value" style="font-variant-numeric:tabular-nums;">¥{{ detail.first_leg_fee }}</span></div>
                    </div>

                    <div class="detail-section">
                        <h3>库存信息</h3>
                        <div class="detail-row"><span class="label">总库存</span><span class="value" style="font-variant-numeric:tabular-nums;">{{ detail.stock_total }} 件</span></div>
                        <div class="detail-row"><span class="label">在途</span><span class="value" style="font-variant-numeric:tabular-nums;">{{ detail.in_transit }} 件</span></div>
                        <div class="detail-row"><span class="label">库存状态</span><span class="value">
                            <span class="tag" :class="stockTagClass(detail.stock_status)">{{ detail.stock_status }}</span>
                        </span></div>
                    </div>

                    <div class="detail-section" v-if="detail.warehouses && detail.warehouses.length > 0">
                        <h3>仓库明细</h3>
                        <table class="product-table" style="font-size:13px;">
                            <thead><tr><th>仓库</th><th>库存</th><th>在途</th></tr></thead>
                            <tbody>
                                <tr v-for="w in detail.warehouses" :key="w.warehouse">
                                    <td>{{ w.warehouse }}</td>
                                    <td style="font-variant-numeric:tabular-nums;">{{ w.stock }}</td>
                                    <td style="font-variant-numeric:tabular-nums;">{{ w.in_transit }}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="detail-section">
                        <h3>产品属性</h3>
                        <div class="detail-row"><span class="label">重量</span><span class="value">{{ detail.weight || '—' }}</span></div>
                        <div class="detail-row"><span class="label">材质</span><span class="value">{{ detail.material || '—' }}</span></div>
                        <div class="detail-row"><span class="label">HS CODE</span><span class="value" style="font-family:var(--font-mono);">{{ detail.hs_code || '—' }}</span></div>
                        <div class="detail-row" v-if="detail.packaging"><span class="label">包装方式</span><span class="value">{{ detail.packaging }}</span></div>
                        <div class="detail-row" v-if="detail.feature_code"><span class="label">特征码</span><span class="value">{{ detail.feature_code }}</span></div>
                    </div>

                    <div class="detail-section" v-if="detail.order_fees && (detail.order_fees.east || detail.order_fees.west)">
                        <h3>订单处理费</h3>
                        <div class="fee-card" v-if="detail.order_fees.east">
                            <div class="fee-title">美东处理费: ${{ detail.order_fees.east.processing_fee }}</div>
                            <div class="fee-desc">{{ detail.fee_explanations.east }}</div>
                            <div style="font-size:12px;margin-top:4px;color:var(--text-secondary);">核重: {{ detail.order_fees.east.weight_kg }}kg / {{ detail.order_fees.east.weight_lb }}lb</div>
                        </div>
                        <div class="fee-card" v-if="detail.order_fees.west">
                            <div class="fee-title">美西处理费: ${{ detail.order_fees.west.processing_fee }}</div>
                            <div class="fee-desc">{{ detail.fee_explanations.west }}</div>
                            <div style="font-size:12px;margin-top:4px;color:var(--text-secondary);">仓库: {{ detail.order_fees.west.warehouse }} | 核重: {{ detail.order_fees.west.weight_g }}g | 尺寸: {{ detail.order_fees.west.dimensions }}</div>
                        </div>
                        <div class="fee-card" v-if="detail.first_leg_fee">
                            <div class="fee-title">头程费: ¥{{ detail.first_leg_fee }}</div>
                            <div class="fee-desc">{{ detail.fee_explanations.first_leg_fee }}</div>
                        </div>
                    </div>
                </template>
            </div>
        </template>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
<script>
const { createApp, ref, reactive, onMounted, computed } = Vue;

createApp({
    setup() {
        const page = ref('dashboard');
        const API = window.location.origin + '/api';

        // ====== 统计卡片 ======
        const stats = ref({});
        const loadStats = async () => {
            try {
                const res = await fetch(`${API}/stats`);
                const json = await res.json();
                if (json.code === 0) stats.value = json.data;
            } catch (e) { console.error(e); }
        };

        // ====== 矩阵看板 ======
        const matrixMode = ref('category,price_range');
        const matrixData = ref({});
        const matrixLoading = ref(false);
        const [defaultX, defaultY] = matrixMode.value.split(',');
        const xAxisLabel = ref(defaultX === 'category' ? '品类' : defaultX === 'price_range' ? '价格区间' : defaultX === 'stock_status' ? '库存状态' : '产品状态');
        const yAxisLabel = ref(defaultY === 'category' ? '品类' : defaultY === 'price_range' ? '价格区间' : defaultY === 'stock_status' ? '库存状态' : '产品状态');

        const axisLabelMap = {
            category: '品类', price_range: '价格区间', stock_status: '库存状态', product_status: '产品状态'
        };

        const loadMatrix = async () => {
            matrixLoading.value = true;
            const [x, y] = matrixMode.value.split(',');
            xAxisLabel.value = axisLabelMap[x] || x;
            yAxisLabel.value = axisLabelMap[y] || y;
            try {
                const res = await fetch(`${API}/matrix?x_axis=${x}&y_axis=${y}`);
                const json = await res.json();
                if (json.code === 0) matrixData.value = json.data;
            } catch (e) { console.error(e); }
            matrixLoading.value = false;
        };

        const switchMatrix = (mode) => {
            matrixMode.value = mode;
            loadMatrix();
        };

        const cellClick = (x, y) => {
            page.value = 'products';
            const [xAxis, yAxis] = matrixMode.value.split(',');
            filters.keyword = '';
            filters.category = xAxis === 'category' ? x : '';
            filters.stock_status = yAxis === 'stock_status' ? y : (xAxis === 'stock_status' ? x : '');
            if (xAxis === 'price_range' || yAxis === 'price_range') {
                const range = xAxis === 'price_range' ? x : y;
                const match = range?.match(/\$(\d+)-(\d+)/);
                if (match) {
                    filters.min_price = parseInt(match[1]);
                    filters.max_price = parseInt(match[2]);
                }
            }
            loadProducts();
        };

        // ====== 商品列表 ======
        const products = ref([]);
        const total = ref(0);
        const currentPage = ref(1);
        const pageSize = ref(20);
        const productsLoading = ref(false);
        const viewMode = ref('card');
        const categories = ref([]);
        const filters = reactive({
            keyword: '', category: '', stock_status: '', product_status: '',
            min_price: null, max_price: null
        });

        const loadProducts = async () => {
            productsLoading.value = true;
            const params = new URLSearchParams({
                page: currentPage.value, page_size: pageSize.value,
                sort: 'updated_at', order: 'desc'
            });
            if (filters.keyword) params.set('keyword', filters.keyword);
            if (filters.category) params.set('category', filters.category);
            if (filters.stock_status) params.set('stock_status', filters.stock_status);
            if (filters.product_status) params.set('product_status', filters.product_status);
            if (filters.min_price) params.set('min_price', filters.min_price);
            if (filters.max_price) params.set('max_price', filters.max_price);

            try {
                const res = await fetch(`${API}/products?${params}`);
                const json = await res.json();
                if (json.code === 0) {
                    products.value = json.data.list;
                    total.value = json.data.total;
                }
            } catch (e) { console.error(e); }
            productsLoading.value = false;
        };

        const loadCategories = async () => {
            try {
                const res = await fetch(`${API}/products/categories`);
                const json = await res.json();
                if (json.code === 0) categories.value = json.data;
            } catch (e) { console.error(e); }
        };

        const resetFilters = () => {
            filters.keyword = ''; filters.category = '';
            filters.stock_status = ''; filters.product_status = '';
            filters.min_price = null; filters.max_price = null;
            currentPage.value = 1;
            loadProducts();
        };

        const changePage = (p) => {
            currentPage.value = p;
            loadProducts();
        };

        // ====== 商品详情 ======
        const detailVisible = ref(false);
        const detail = ref(null);
        const detailLoading = ref(false);

        const showDetail = async (id) => {
            detailVisible.value = true;
            detailLoading.value = true;
            try {
                const res = await fetch(`${API}/products/${id}`);
                const json = await res.json();
                if (json.code === 0) detail.value = json.data;
            } catch (e) { console.error(e); }
            detailLoading.value = false;
        };

        // ====== 导入管理 ======
        const importFile = ref(null);
        const comparing = ref(false);
        const compareResult = ref(null);
        const importing = ref(false);
        const importResult = ref(null);
        const importLogs = ref([]);
        const clearing = ref(false);
        const selectedSkus = ref(new Set());

        // 计算属性：变更项/新增项是否全选
        const allChangedSelected = computed(() => {
            if (!compareResult.value || compareResult.value.changed_items.length === 0) return false;
            return compareResult.value.changed_items.every(item => selectedSkus.value.has(item.sku));
        });
        const allNewSelected = computed(() => {
            if (!compareResult.value || compareResult.value.new_items.length === 0) return false;
            return compareResult.value.new_items.every(item => selectedSkus.value.has(item.sku));
        });

        const onFileSelect = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            importFile.value = file;
            compareResult.value = null;
            importResult.value = null;
            selectedSkus.value = new Set();
            comparing.value = true;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch(`${API}/import/compare`, { method: 'POST', body: formData });
                const json = await res.json();
                if (json.code === 0) {
                    compareResult.value = json.data;
                    // 默认全选
                    selectAll();
                } else {
                    importResult.value = { code: 1, message: json.detail || '比对失败' };
                }
            } catch (e) {
                importResult.value = { code: 1, message: '网络错误: ' + e.message };
            }
            comparing.value = false;
        };

        const toggleSku = (sku) => {
            const newSet = new Set(selectedSkus.value);
            if (newSet.has(sku)) { newSet.delete(sku); } else { newSet.add(sku); }
            selectedSkus.value = newSet;
        };

        const toggleAllChanged = (e) => {
            const newSet = new Set(selectedSkus.value);
            if (e.target.checked) {
                compareResult.value.changed_items.forEach(item => newSet.add(item.sku));
            } else {
                compareResult.value.changed_items.forEach(item => newSet.delete(item.sku));
            }
            selectedSkus.value = newSet;
        };

        const toggleAllNew = (e) => {
            const newSet = new Set(selectedSkus.value);
            if (e.target.checked) {
                compareResult.value.new_items.forEach(item => newSet.add(item.sku));
            } else {
                compareResult.value.new_items.forEach(item => newSet.delete(item.sku));
            }
            selectedSkus.value = newSet;
        };

        const selectAll = () => {
            const newSet = new Set();
            if (compareResult.value) {
                compareResult.value.changed_items.forEach(item => newSet.add(item.sku));
                compareResult.value.new_items.forEach(item => newSet.add(item.sku));
            }
            selectedSkus.value = newSet;
        };

        const deselectAll = () => { selectedSkus.value = new Set(); };

        const selectNewOnly = () => {
            const newSet = new Set();
            if (compareResult.value) {
                compareResult.value.new_items.forEach(item => newSet.add(item.sku));
            }
            selectedSkus.value = newSet;
        };

        const selectChangedOnly = () => {
            const newSet = new Set();
            if (compareResult.value) {
                compareResult.value.changed_items.forEach(item => newSet.add(item.sku));
            }
            selectedSkus.value = newSet;
        };

        const confirmImport = async () => {
            if (!compareResult.value || selectedSkus.value.size === 0) return;
            importing.value = true;
            importResult.value = null;

            const formData = new FormData();
            formData.append('session_id', compareResult.value.session_id);
            formData.append('selected_skus', JSON.stringify([...selectedSkus.value]));

            try {
                const res = await fetch(`${API}/import/apply`, { method: 'POST', body: formData });
                const json = await res.json();
                importResult.value = json;
                if (json.code === 0) {
                    compareResult.value = null;
                    importFile.value = null;
                    selectedSkus.value = new Set();
                    loadLogs();
                    loadStats();
                    loadCategories();
                }
            } catch (e) {
                importResult.value = { code: 1, message: '网络错误: ' + e.message };
            }
            importing.value = false;
        };

        const loadLogs = async () => {
            try {
                const res = await fetch(`${API}/import/logs?page=1&page_size=20`);
                const json = await res.json();
                if (json.code === 0) importLogs.value = json.data.list;
            } catch (e) { console.error(e); }
        };

        const rollback = async (batchNo) => {
            if (!confirm(`确定回滚批次 ${batchNo}?`)) return;
            try {
                const res = await fetch(`${API}/import/rollback/${batchNo}`, { method: 'POST' });
                const json = await res.json();
                alert(json.message);
                loadLogs();
                loadStats();
            } catch (e) { console.error(e); }
        };

        const clearAllData = async () => {
            // 二次确认，防止误操作
            const step1 = confirm('⚠️ 确定要清空所有数据吗？\n\n这将删除：所有商品、库存明细、处理费、历史快照、导入日志和图片文件。\n此操作不可恢复！');
            if (!step1) return;
            const step2 = confirm('再次确认：真的要清空全部数据吗？\n\n输入确定后将立即执行，无法撤销。');
            if (!step2) return;

            clearing.value = true;
            try {
                const res = await fetch(`${API}/import/clear-all`, { method: 'POST' });
                const json = await res.json();
                if (json.code === 0) {
                    const d = json.data;
                    alert(`已清空：${d.deleted_products} 个商品 / ${d.deleted_warehouses} 条库存 / ${d.deleted_fees} 条处理费 / ${d.deleted_images} 张图片`);
                    // 重置前端状态
                    compareResult.value = null;
                    importFile.value = null;
                    importResult.value = null;
                    importLogs.value = [];
                    selectedSkus.value = new Set();
                    loadStats();
                    loadCategories();
                } else {
                    alert('清空失败: ' + (json.detail || '未知错误'));
                }
            } catch (e) {
                alert('网络错误: ' + e.message);
            }
            clearing.value = false;
        };

        // ====== 工具函数 ======
        const stockTagClass = (status) => {
            if (status === '充足') return 'tag-green';
            if (status === '紧张') return 'tag-orange';
            return 'tag-red';
        };

        const statusTagClass = (status) => {
            if (!status || status === '在售') return 'tag-green';
            if (status.includes('下架')) return 'tag-gray';
            if (status.includes('包销')) return 'tag-magenta';
            return 'tag-amber';
        };

        const handleImgError = (e) => {
            e.target.style.display = 'none';
        };

        const goPage = (p) => {
            page.value = p;
            if (p === 'dashboard') { loadStats(); loadMatrix(); }
            if (p === 'products' && products.value.length === 0) { loadProducts(); loadCategories(); }
            if (p === 'import') { loadLogs(); }
        };

        // ====== 初始化 ======
        onMounted(() => {
            loadStats();
            loadMatrix();
        });

        return {
            page, stats, goPage,
            matrixMode, matrixData, matrixLoading, xAxisLabel, yAxisLabel,
            switchMatrix, cellClick,
            products, total, currentPage, pageSize, productsLoading, viewMode,
            categories, filters, loadProducts, resetFilters, changePage,
            detailVisible, detail, detailLoading, showDetail,
            importFile, comparing, compareResult, importing, importResult, importLogs, clearing,
            selectedSkus, allChangedSelected, allNewSelected,
            onFileSelect, confirmImport, rollback, clearAllData,
            toggleSku, toggleAllChanged, toggleAllNew,
            selectAll, deselectAll, selectNewOnly, selectChangedOnly,
            stockTagClass, statusTagClass, handleImgError,
        };
    }
}).mount('#app');
</script>
</body>
</html>
